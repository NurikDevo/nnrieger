<!DOCTYPE html> 

<html lang="en"> 

<head> 

<meta charset="UTF-8"> 

<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>.nnrieger</title> 

<style> 

  * { box-sizing: border-box; } 

 

  body { 

    margin: 0; 

    min-height: 100vh; 

    display: grid; 

    place-items: center; 

    overflow: hidden; 

    background: #91ddff; 

    font-family: Arial, monospace; 

    color: #172033; 

  } 

 

  #gameBox { 

    position: relative; 

    width: min(900px, 100vw); 

    aspect-ratio: 900 / 600; 

    overflow: hidden; 

    border: 7px solid #172033; 

    background: #7ed7ff; 

    box-shadow: 10px 10px 0 #172033; 

  } 

 

  canvas { 

    display: block; 

    width: 100%; 

    height: 100%; 

    cursor: crosshair; 

    image-rendering: pixelated; 

  } 

 

  #hud { 

    position: absolute; 

    top: 10px; 

    left: 10px; 

    right: 10px; 

    display: none; 

    justify-content: space-between; 

    gap: 8px; 

    pointer-events: none; 

  } 

 

  .hudItem { 

    padding: 8px 11px; 

    border: 3px solid #172033; 

    background: #fff9dc; 

    font-weight: bold; 

    font-size: 15px; 

  } 

 

  #exitButton { 

    display: none; 

    position: absolute; 

    right: 10px; 

    bottom: 10px; 

    padding: 9px 12px; 

    border: 3px solid #172033; 

    background: #ff9ca6; 

    color: #172033; 

    font-weight: bold; 

    cursor: pointer; 

    box-shadow: 3px 3px 0 #172033; 

  } 

 

  #exitButton:active, 

  button:active { 

    transform: translate(2px, 2px); 

    box-shadow: 1px 1px 0 #172033; 

  } 

 

  .screen { 

    position: absolute; 

    inset: 0; 

    z-index: 5; 

    display: grid; 

    place-items: center; 

    padding: 20px; 

    text-align: center; 

    background: rgba(255, 249, 220, 0.93); 

  } 

 

  .hidden { display: none !important; } 

 

  .card { 

    max-width: 630px; 

    padding: 25px; 

    border: 6px solid #172033; 

    background: #fff9dc; 

    box-shadow: 8px 8px 0 #172033; 

  } 

 

  h1 { 

    margin: 0 0 8px; 

    font-size: clamp(40px, 8vw, 74px); 

    letter-spacing: -4px; 

  } 

 

  h2 { margin: 0 0 12px; } 

 

  p { 

    margin: 10px 0; 

    line-height: 1.5; 

  } 

 

  .creator { 

    color: #663aa6; 

    font-weight: bold; 

  } 

 

  button { 

    margin-top: 10px; 

    padding: 12px 18px; 

    border: 4px solid #172033; 

    background: #ffd54d; 

    color: #172033; 

    font-weight: bold; 

    font-size: 16px; 

    cursor: pointer; 

    box-shadow: 4px 4px 0 #172033; 

  } 

 

  kbd { 

    padding: 2px 5px; 

    border: 2px solid #172033; 

    background: white; 

    font-weight: bold; 

  } 

</style> 

</head> 

<body> 

 

<div id="gameBox"> 

  <canvas id="gameCanvas" width="900" height="600"></canvas> 

 

  <div id="hud"> 

    <div class="hudItem" id="levelHud">LEVEL 1</div> 

    <div class="hudItem" id="hpHud">HP: 100 / 100</div> 

    <div class="hudItem" id="ammoHud">AMMO: 50</div> 

  </div> 

 

  <button id="exitButton">EXIT GAME</button> 

 

  <div class="screen" id="startScreen"> 

    <div class="card"> 

      <h1>.nnrieger</h1> 

      <p class="creator">Created by Nuriddin</p> 

      <p>A bright, blocky, and friendly action game.</p> 

      <p> 

        Move with <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 

        or the arrow keys.<br> 

        Aim with the mouse and click to fire. 

      </p> 

      <button id="playButton">PLAY GAME</button> 

    </div> 

  </div> 

 

  <div class="screen hidden" id="messageScreen"> 

    <div class="card"> 

      <h2 id="messageTitle">Level Complete!</h2> 

      <p id="messageText"></p> 

      <button id="continueButton">CONTINUE</button> 

    </div> 

  </div> 

 

  <div class="screen hidden" id="closedScreen"> 

    <div class="card"> 

      <h2>Game closed</h2> 

      <p>Thanks for playing .nnrieger!</p> 

    </div> 

  </div> 

</div> 

 

<script> 

const canvas = document.getElementById("gameCanvas"); 

const ctx = canvas.getContext("2d"); 

 

const startScreen = document.getElementById("startScreen"); 

const messageScreen = document.getElementById("messageScreen"); 

const closedScreen = document.getElementById("closedScreen"); 

const playButton = document.getElementById("playButton"); 

const continueButton = document.getElementById("continueButton"); 

const exitButton = document.getElementById("exitButton"); 

 

const messageTitle = document.getElementById("messageTitle"); 

const messageText = document.getElementById("messageText"); 

const levelHud = document.getElementById("levelHud"); 

const hpHud = document.getElementById("hpHud"); 

const ammoHud = document.getElementById("ammoHud"); 

const hud = document.getElementById("hud"); 

 

const WIDTH = canvas.width; 

const HEIGHT = canvas.height; 

 

let gameStarted = false; 

let gamePaused = true; 

let currentLevel = 1; 

let lastTime = performance.now(); 

let shotReadyAt = 0; 

let mouseHeld = false; 

 

const keys = {}; 

const mouse = { x: WIDTH / 2, y: HEIGHT / 2 }; 

 

const player = { 

  x: WIDTH / 2, 

  y: HEIGHT / 2, 

  hp: 100, 

  maxHp: 100, 

  ammo: 50, 

  speed: 250, 

  angle: 0 

}; 

 

let enemies = []; 

let particles = []; 

 

const levelData = { 

  1: { 

    name: "Funny Spider Field", 

    reward: 25, 

    enemies: [ 

      { type: "spider", x: 150, y: 170 }, 

      { type: "spider", x: 740, y: 160 }, 

      { type: "spider", x: 190, y: 460 }, 

      { type: "spider", x: 700, y: 445 } 

    ] 

  }, 

  2: { 

    name: "Blue Smile Hall", 

    reward: 20, 

    enemies: [ 

      { type: "blue", x: 700, y: 310 } 

    ] 

  }, 

  3: { 

    name: "Red Brow Arena", 

    reward: 0, 

    enemies: [ 

      { type: "red", x: 700, y: 310 } 

    ] 

  } 

}; 

 

const enemyTypes = { 

  spider: { 

    hp: 30, 

    damage: 5, 

    speed: 70, 

    size: 42, 

    color: "#8f67dc", 

    attackDistance: 47 

  }, 

  blue: { 

    hp: 50, 

    damage: 10, 

    speed: 82, 

    size: 56, 

    color: "#2d91f6", 

    attackDistance: 55 

  }, 

  red: { 

    hp: 100, 

    damage: 15, 

    speed: 88, 

    size: 62, 

    color: "#ed4c58", 

    attackDistance: 58 

  } 

}; 

 

function makeEnemy(type, x, y) { 

  const info = enemyTypes[type]; 

 

  return { 

    type: type, 

    x: x, 

    y: y, 

    hp: info.hp, 

    maxHp: info.hp, 

    damage: info.damage, 

    speed: info.speed, 

    size: info.size, 

    color: info.color, 

    attackDistance: info.attackDistance, 

    attackCooldown: 0, 

    hurtTime: 0, 

    animation: Math.random() * 10 

  }; 

} 

 

function loadLevel() { 

  const data = levelData[currentLevel]; 

 

  enemies = data.enemies.map(enemy => { 

    return makeEnemy(enemy.type, enemy.x, enemy.y); 

  }); 

 

  particles = []; 

  player.x = WIDTH / 2; 

  player.y = HEIGHT / 2; 

  shotReadyAt = 0; 

 

  updateHud(); 

} 

 

function updateHud() { 

  levelHud.textContent = "LEVEL " + currentLevel; 

  hpHud.textContent = "HP: " + Math.max(0, Math.ceil(player.hp)) + " / 100"; 

  ammoHud.textContent = "AMMO: " + player.ammo; 

} 

 

function startGame() { 

  currentLevel = 1; 

  player.hp = 100; 

  player.ammo = 50; 

 

  startScreen.classList.add("hidden"); 

  messageScreen.classList.add("hidden"); 

  closedScreen.classList.add("hidden"); 

 

  hud.style.display = "flex"; 

  exitButton.style.display = "block"; 

 

  loadLevel(); 

  gameStarted = true; 

  gamePaused = false; 

} 

 

function showMessage(title, text, buttonText, action) { 

  gamePaused = true; 

 

  messageTitle.textContent = title; 

  messageText.innerHTML = text; 

  continueButton.textContent = buttonText; 

  continueButton.onclick = action; 

 

  messageScreen.classList.remove("hidden"); 

} 

 

function completeLevel() { 

  if (currentLevel === 1) { 

    player.ammo += 25; 

    updateHud(); 

 

    showMessage( 

      "Level 1 Complete!", 

      "The funny blocky spiders danced away.<br>You found <b>25 ammo</b>!", 

      "GO TO LEVEL 2", 

      function () { 

        currentLevel = 2; 

        messageScreen.classList.add("hidden"); 

        loadLevel(); 

        gamePaused = false; 

      } 

    ); 

  } else if (currentLevel === 2) { 

    player.ammo += 20; 

    updateHud(); 

 

    showMessage( 

      "Level 2 Complete!", 

      "The blue smile guy waved goodbye.<br>You found <b>20 ammo</b>!", 

      "GO TO LEVEL 3", 

      function () { 

        currentLevel = 3; 

        messageScreen.classList.add("hidden"); 

        loadLevel(); 

        gamePaused = false; 

      } 

    ); 

  } else { 

    showMessage( 

      "You Win!", 

      "You finished all three colorful levels of .nnrieger!", 

      "PLAY AGAIN", 

      function () { 

        startGame(); 

      } 

    ); 

  } 

} 

 

function gameOver() { 

  showMessage( 

    "Try Again!", 

    "Your hero ran out of HP.<br>Restart with <b>100 HP</b> and <b>50 ammo</b>.", 

    "RESTART", 

    function () { 

      startGame(); 

    } 

  ); 

} 

 

function addParticles(x, y, color, amount) { 

  for (let i = 0; i < amount; i++) { 

    const angle = Math.random() * Math.PI * 2; 

    const speed = 50 + Math.random() * 150; 

 

    particles.push({ 

      x: x, 

      y: y, 

      vx: Math.cos(angle) * speed, 

      vy: Math.sin(angle) * speed, 

      color: color, 

      size: 3 + Math.random() * 5, 

      life: 0.3 + Math.random() * 0.35 

    }); 

  } 

} 

 

function shoot() { 

  const now = performance.now(); 

 

  if (gamePaused || player.ammo <= 0 || now < shotReadyAt) return; 

 

  player.ammo--; 

  shotReadyAt = now + 220; 

 

  let closestEnemy = null; 

  let closestDistance = Infinity; 

 

  for (const enemy of enemies) { 

    const dx = enemy.x - player.x; 

    const dy = enemy.y - player.y; 

    const distance = Math.hypot(dx, dy); 

 

    const enemyAngle = Math.atan2(dy, dx); 

    let angleDifference = Math.abs(enemyAngle - player.angle); 

 

    if (angleDifference > Math.PI) { 

      angleDifference = Math.PI * 2 - angleDifference; 

    } 

 

    if (angleDifference < 0.22 && distance < closestDistance) { 

      closestEnemy = enemy; 

      closestDistance = distance; 

    } 

  } 

 

  if (closestEnemy) { 

    closestEnemy.hp -= 5; 

    closestEnemy.hurtTime = 0.14; 

 

    addParticles(closestEnemy.x, closestEnemy.y, "#fff16b", 10); 

 

    if (closestEnemy.hp <= 0) { 

      addParticles(closestEnemy.x, closestEnemy.y, closestEnemy.color, 25); 

      enemies = enemies.filter(enemy => enemy !== closestEnemy); 

    } 

  } else { 

    addParticles( 

      player.x + Math.cos(player.angle) * 140, 

      player.y + Math.sin(player.angle) * 140, 

      "#fff16b", 

      5 

    ); 

  } 

 

  updateHud(); 

} 

 

function update(dt) { 

  let moveX = 0; 

  let moveY = 0; 

 

  if (keys["w"] || keys["arrowup"]) moveY--; 

  if (keys["s"] || keys["arrowdown"]) moveY++; 

  if (keys["a"] || keys["arrowleft"]) moveX--; 

  if (keys["d"] || keys["arrowright"]) moveX++; 

 

  if (moveX !== 0 || moveY !== 0) { 

    const length = Math.hypot(moveX, moveY); 

 

    player.x += (moveX / length) * player.speed * dt; 

    player.y += (moveY / length) * player.speed * dt; 

  } 

 

  player.x = Math.max(25, Math.min(WIDTH - 25, player.x)); 

  player.y = Math.max(85, Math.min(HEIGHT - 25, player.y)); 

 

  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x); 

 

  if (mouseHeld) shoot(); 

 

  for (const enemy of enemies) { 

    enemy.animation += dt; 

    enemy.hurtTime = Math.max(0, enemy.hurtTime - dt); 

    enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt); 

 

    const dx = player.x - enemy.x; 

    const dy = player.y - enemy.y; 

    const distance = Math.hypot(dx, dy) || 1; 

 

    if (distance > enemy.attackDistance) { 

      enemy.x += (dx / distance) * enemy.speed * dt; 

      enemy.y += (dy / distance) * enemy.speed * dt; 

    } else if (enemy.attackCooldown <= 0) { 

      player.hp -= enemy.damage; 

      enemy.attackCooldown = 0.9; 

 

      addParticles(player.x, player.y, "#ff6868", 13); 

      updateHud(); 

 

      if (player.hp <= 0) { 

        gameOver(); 

        return; 

      } 

    } 

  } 

 

  particles = particles.filter(particle => { 

    particle.x += particle.vx * dt; 

    particle.y += particle.vy * dt; 

    particle.vx *= 0.91; 

    particle.vy *= 0.91; 

    particle.life -= dt; 

 

    return particle.life > 0; 

  }); 

 

  if (enemies.length === 0) { 

    completeLevel(); 

  } 

} 

 

function drawBackground() { 

  const colors = { 

    1: "#8be59f", 

    2: "#86cdfd", 

    3: "#ffb76d" 

  }; 

 

  ctx.fillStyle = colors[currentLevel]; 

  ctx.fillRect(0, 0, WIDTH, HEIGHT); 

 

  for (let y = 75; y < HEIGHT; y += 50) { 

    for (let x = 0; x < WIDTH; x += 50) { 

      if ((x / 50 + y / 50) % 2 === 0) { 

        ctx.fillStyle = "rgba(255,255,255,0.22)"; 

        ctx.fillRect(x, y, 50, 50); 

      } 

    } 

  } 

 

  ctx.fillStyle = "#172033"; 

  ctx.fillRect(0, 65, WIDTH, 6); 

 

  ctx.fillStyle = "rgba(23,32,51,0.12)"; 

  for (let i = 0; i < 9; i++) { 

    ctx.fillRect(40 + i * 102, 110 + (i % 3) * 150, 32, 32); 

  } 

} 

 

function drawHealthBar(entity) { 

  const width = entity.size; 

  const x = entity.x - width / 2; 

  const y = entity.y - entity.size / 2 - 17; 

 

  ctx.fillStyle = "#172033"; 

  ctx.fillRect(x - 2, y - 2, width + 4, 9); 

 

  ctx.fillStyle = "#ed4c58"; 

  ctx.fillRect(x, y, width, 5); 

 

  ctx.fillStyle = "#38c97b"; 

  ctx.fillRect(x, y, width * Math.max(0, entity.hp / entity.maxHp), 5); 

} 

 

function drawSpider(enemy) { 

  const size = enemy.size; 

  const bounce = Math.sin(enemy.animation * 5) * 2; 

 

  ctx.save(); 

  ctx.translate(enemy.x, enemy.y + bounce); 

 

  ctx.strokeStyle = "#172033"; 

  ctx.lineWidth = 6; 

 

  for (const side of [-1, 1]) { 

    for (let leg = -1; leg <= 1; leg++) { 

      ctx.beginPath(); 

      ctx.moveTo(side * 12, leg * 10); 

      ctx.lineTo(side * 30, leg * 13 + 8); 

      ctx.stroke(); 

    } 

  } 

 

  ctx.fillStyle = enemy.hurtTime > 0 ? "#ffffff" : enemy.color; 

  ctx.fillRect(-size / 2, -size / 2, size, size); 

 

  ctx.strokeStyle = "#172033"; 

  ctx.lineWidth = 4; 

  ctx.strokeRect(-size / 2, -size / 2, size, size); 

 

  ctx.fillStyle = "#ffffff"; 

  ctx.fillRect(-14, -12, 10, 10); 

  ctx.fillRect(5, -12, 10, 10); 

 

  ctx.fillStyle = "#172033"; 

  ctx.fillRect(-10, -9, 4, 4); 

  ctx.fillRect(9, -9, 4, 4); 

 

  ctx.fillRect(-13, 7, 26, 4); 

  ctx.fillRect(-8, 12, 16, 4); 

 

  ctx.restore(); 

} 

 

function drawSwordGuy(enemy) { 

  const size = enemy.size; 

  const isBlue = enemy.type === "blue"; 

  const blinking = isBlue && (enemy.animation % 2.7 < 0.14); 

 

  ctx.save(); 

  ctx.translate(enemy.x, enemy.y); 

 

  ctx.fillStyle = "#172033"; 

  ctx.fillRect(-size * 0.46, size * 0.28, size * 0.27, size * 0.37); 

  ctx.fillRect(size * 0.19, size * 0.28, size * 0.27, size * 0.37); 

 

  ctx.fillStyle = enemy.hurtTime > 0 ? "#ffffff" : enemy.color; 

  ctx.fillRect(-size / 2, -size / 2, size, size); 

 

  ctx.strokeStyle = "#172033"; 

  ctx.lineWidth = 5; 

  ctx.strokeRect(-size / 2, -size / 2, size, size); 

 

  ctx.fillStyle = "#ffffff"; 

 

  if (blinking) { 

    ctx.fillRect(-17, -10, 12, 3); 

    ctx.fillRect(5, -10, 12, 3); 

  } else { 

    ctx.fillRect(-17, -15, 12, 11); 

    ctx.fillRect(5, -15, 12, 11); 

 

    ctx.fillStyle = "#172033"; 

    ctx.fillRect(-13, -11, 4, 4); 

    ctx.fillRect(9, -11, 4, 4); 

  } 

 

  ctx.fillStyle = "#172033"; 

 

  if (isBlue) { 

    ctx.fillRect(-17, 10, 34, 5); 

    ctx.fillRect(-10, 15, 20, 4); 

  } else { 

    const eyebrowMove = Math.sin(enemy.animation * 5) * 2; 

 

    ctx.save(); 

    ctx.translate(-12, -22); 

    ctx.rotate(-0.25 + eyebrowMove * 0.02); 

    ctx.fillRect(-10, -2, 20, 5); 

    ctx.restore(); 

 

    ctx.save(); 

    ctx.translate(12, -22); 

    ctx.rotate(0.25 - eyebrowMove * 0.02); 

    ctx.fillRect(-10, -2, 20, 5); 

    ctx.restore(); 

 

    ctx.fillRect(-17, 13, 34, 5); 

  } 

 

  ctx.save(); 

  ctx.translate(size * 0.38, size * 0.12); 

  ctx.rotate(-0.5); 

 

  ctx.fillStyle = "#dfe8f0"; 

  ctx.fillRect(0, -4, 42, 9); 

 

  ctx.fillStyle = "#ffd54d"; 

  ctx.fillRect(-6, -13, 8, 27); 

 

  ctx.restore(); 

  ctx.restore(); 

} 

 

function drawPlayer() { 

  ctx.save(); 

  ctx.translate(player.x, player.y); 

  ctx.rotate(player.angle); 

 

  ctx.fillStyle = "#ffd39f"; 

  ctx.fillRect(-18, -18, 36, 36); 

 

  ctx.strokeStyle = "#172033"; 

  ctx.lineWidth = 4; 

  ctx.strokeRect(-18, -18, 36, 36); 

 

  ctx.fillStyle = "#172033"; 

  ctx.fillRect(-10, -7, 5, 5); 

  ctx.fillRect(6, -7, 5, 5); 

  ctx.fillRect(-7, 8, 15, 3); 

 

  ctx.fillStyle = "#455b75"; 

  ctx.fillRect(12, -9, 44, 18); 

 

  ctx.fillStyle = "#b9d3e5"; 

  ctx.fillRect(50, -5, 16, 10); 

 

  ctx.fillStyle = "#ffd54d"; 

  ctx.fillRect(18, 9, 15, 9); 

 

  ctx.restore(); 

} 

 

function draw() { 

  drawBackground(); 

 

  for (const enemy of enemies) { 

    if (enemy.type === "spider") { 

      drawSpider(enemy); 

    } else { 

      drawSwordGuy(enemy); 

    } 

 

    drawHealthBar(enemy); 

  } 

 

  for (const particle of particles) { 

    ctx.globalAlpha = Math.min(1, particle.life * 2); 

    ctx.fillStyle = particle.color; 

    ctx.fillRect(particle.x, particle.y, particle.size, particle.size); 

  } 

 

  ctx.globalAlpha = 1; 

  drawPlayer(); 

 

  ctx.fillStyle = "rgba(23,32,51,0.85)"; 

  ctx.font = "bold 15px Arial"; 

  ctx.textAlign = "center"; 

 

  let info = ""; 

 

  if (currentLevel === 1) { 

    info = "Funny spiders: 30 HP • 5 damage"; 

  } else if (currentLevel === 2) { 

    info = "Blue sword guy: 50 HP • 10 damage"; 

  } else { 

    info = "Red sword guy: 100 HP • 15 damage"; 

  } 

 

  ctx.fillText(info, WIDTH / 2, HEIGHT - 18); 

 

  if (gameStarted && player.ammo === 0) { 

    ctx.fillStyle = "#ed4c58"; 

    ctx.font = "bold 23px Arial"; 

    ctx.fillText("OUT OF AMMO!", WIDTH / 2, 105); 

  } 

} 

 

function gameLoop(time) { 

  const dt = Math.min(0.035, (time - lastTime) / 1000); 

  lastTime = time; 

 

  if (gameStarted && !gamePaused) { 

    update(dt); 

  } 

 

  if (gameStarted) { 

    draw(); 

  } 

 

  requestAnimationFrame(gameLoop); 

} 

 

playButton.addEventListener("click", startGame); 

 

window.addEventListener("keydown", function (event) { 

  const key = event.key.toLowerCase(); 

  keys[key] = true; 

 

  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) { 

    event.preventDefault(); 

  } 

 

  if (key === " ") shoot(); 

}); 

 

window.addEventListener("keyup", function (event) { 

  keys[event.key.toLowerCase()] = false; 

}); 

 

canvas.addEventListener("mousemove", function (event) { 

  const rect = canvas.getBoundingClientRect(); 

 

  mouse.x = (event.clientX - rect.left) * (WIDTH / rect.width); 

  mouse.y = (event.clientY - rect.top) * (HEIGHT / rect.height); 

}); 

 

canvas.addEventListener("mousedown", function () { 

  mouseHeld = true; 

  shoot(); 

}); 

 

window.addEventListener("mouseup", function () { 

  mouseHeld = false; 

}); 

 

exitButton.addEventListener("click", function () { 

  gamePaused = true; 

  gameStarted = false; 

  hud.style.display = "none"; 

  exitButton.style.display = "none"; 

  messageScreen.classList.add("hidden"); 

  closedScreen.classList.remove("hidden"); 

 

  window.close(); 

}); 

 

requestAnimationFrame(gameLoop); 

</script> 

 

</body> 

</html>
